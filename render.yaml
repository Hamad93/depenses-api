services:
  - type: web
    name: depenses-api
    runtime: node
    plan: free
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm run start:prod
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_AUTH_TOKEN
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: NODE_VERSION
        value: 22.11.0
