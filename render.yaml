services:
  - type: web
    name: depenses-api
    runtime: node
    plan: free
    buildCommand: npm install && npx prisma generate && npm run build
    # NB: `prisma migrate deploy` cannot connect to libsql:// URLs (Prisma's
    # migration engine doesn't recognize the scheme). Apply schema changes to
    # Turso with `node scripts/apply-migrations-turso.js` (locally, against
    # the production DATABASE_URL) before deploying.
    startCommand: npm run start:prod
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_AUTH_TOKEN
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: NODE_VERSION
        value: 22.14.0
